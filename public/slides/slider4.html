<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Jadwal Sholat • Masjid</title>
<link rel="stylesheet" href="../css/slider4.css">
<script src="/js/prayer-utils.js"></script>
</head>
<body>

<div class="frame">

  <!-- ============ LEFT: PRAYER SCHEDULE ============ -->
  <aside class="schedule" id="schedule">
    <div class="masjid-label">Jadwal Sholat Hari Ini</div>
    <!-- rows injected by JS -->
  </aside>

  <!-- ============ RIGHT: VIDEO STAGE ============ -->
  <div class="stage">
    <video id="player" autoplay muted loop playsinline></video>

    <div class="top-overlay">
      <div class="clock" id="clock">--:--</div>
      <div class="date-line" id="dateLine"><span class="dow">-</span> - -</div>
    </div>

    <div class="bottom-overlay">
      <div class="masjid-info">
        <div class="masjid-badge">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 9 6h6l-3-4zm0 3.2L14.3 8H9.7L12 5.2zM6 9v2c-2.2 0-4 1.8-4 4v6h4v-5h2v5h8v-5h2v5h4v-6c0-2.2-1.8-4-4-4V9c0-1.1-.9-2-2-2h-.5l-1-2h-3l-1 2H8c-1.1 0-2 .9-2 2zm3 3h6v2H9v-2z"/></svg>
        </div>
        <div>
          <p class="masjid-name" id="masjidName"><span class="accent">Masjid</span> &hellip;</p>
          <div class="masjid-address" id="masjidAddress">&nbsp;</div>
        </div>
      </div>
      <div class="next-prayer-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span id="nextLabel">-</span>
        <span class="countdown" id="countdown">-00:00:00</span>
      </div>
    </div>

    <div class="ticker">
      <span id="tickerText">Memuat&hellip;</span>
    </div>
  </div>

</div>

<script>
/* ---------- data sholat & masjid diambil dari API yang sama dengan display.html ---------- */
const ROWS = [
  { key:'Fajr',    id:'shubuh',  name:'Shubuh',  icon:'sunrise' },
  { key:'Sunrise', id:'syuruq',  name:'Syuruq',  icon:'sun' },
  { key:'Dhuhr',   id:'dzuhur',  name:'Dzuhur',  icon:'sun' },
  { key:'Asr',     id:'asr',     name:'Asr',     icon:'sun-cloud' },
  { key:'Maghrib', id:'maghrib', name:'Maghrib', icon:'sunset' },
  { key:'Isha',    id:'isha',    name:'Isha',    icon:'moon' }
];
const VIDEOS = ['video1.mp4', 'video2.mp4', 'video3.mp4'].map(f => '/kumpulan-video/' + f);

const ICONS = {
  sunrise:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v5M4.2 10.2l1.4 1.4M19.8 10.2l-1.4 1.4M2 18h2M20 18h2M6 18a6 6 0 0 1 12 0"/><path d="M2 21h20"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  'sun-cloud':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="9" r="3.2"/><path d="M8 3.5v1.6M3.6 9h1.6M12.4 9h1.2M4.9 5.9l1.1 1.1M11 5.9l-1.1 1.1"/><path d="M9 18h9a3.2 3.2 0 0 0 .4-6.4A4.6 4.6 0 0 0 9.6 13"/></svg>',
  sunset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V11M4.2 8.2l1.4 1.4M19.8 8.2l-1.4 1.4M2 16h2M20 16h2M6 16a6 6 0 0 1 12 0"/><path d="M2 19h20M9 21l3-3 3 3"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>'
};

const DOW = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const MONTH = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

const state = { mosque: null, timings: null };

function renderSchedule() {
  const scheduleEl = document.getElementById('schedule');
  ROWS.forEach(p => {
    const row = document.createElement('div');
    row.className = 'prayer-row';
    row.id = 'row-' + p.id;
    row.innerHTML = `
      <div class="prayer-icon">${ICONS[p.icon] || ICONS.sun}</div>
      <div class="prayer-text">
        <span class="prayer-name">${p.name}</span>
        <span class="prayer-time">${state.timings[p.key].split(' ')[0]}</span>
      </div>`;
    scheduleEl.appendChild(row);
  });
}

function tick() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = `${hh}:${mm}`;
  document.getElementById('dateLine').innerHTML =
    `<span class="dow">${DOW[now.getDay()]}</span> ${now.getDate()} ${MONTH[now.getMonth()]} ${now.getFullYear()}`;

  if (!state.timings) return;

  let activeIdx = -1;
  ROWS.forEach((p, i) => {
    if (now >= parseTimeToday(state.timings[p.key])) activeIdx = i;
  });
  ROWS.forEach((p, i) => {
    document.getElementById('row-' + p.id).classList.toggle('active', i === activeIdx);
  });

  const next = getNextFard(state.timings, now);
  const nextRow = ROWS.find(p => p.key === next.key);
  document.getElementById('nextLabel').textContent = nextRow.name;
  document.getElementById('countdown').textContent = `-${formatDuration(next.time - now)}`;
}

async function init() {
  const [settings, prayerData] = await Promise.all([
    fetch('/api/settings').then(r => r.json()),
    fetch('/api/prayertimes').then(r => r.json())
  ]);
  state.mosque = settings.mosque;
  state.timings = prayerData.timings;

  const shortName = state.mosque.name.replace(/^masjid\s+/i, '');
  document.getElementById('masjidName').innerHTML = `<span class="accent">Masjid</span> ${shortName}`;
  document.getElementById('masjidAddress').textContent = `${state.mosque.city}, ${state.mosque.country}`;
  document.getElementById('tickerText').textContent =
    `Ahlan Wa Sahlan,   ${state.mosque.name} • Jaga kebersihan dan ketertiban masjid •`;

  renderSchedule();
  tick();
  setInterval(tick, 1000);
}
init();

/* ---------- pemutar video ---------- */
let videoIdx = 0;
const player = document.getElementById('player');
player.loop = false;

function playCurrent() {
  player.src = VIDEOS[videoIdx];
  player.play().catch(() => {});
}
player.addEventListener('ended', () => {
  videoIdx = (videoIdx + 1) % VIDEOS.length;
  playCurrent();
});
playCurrent();
</script>
</body>
</html>

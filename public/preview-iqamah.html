<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Preview Overlay Iqamah • Masjid</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/display.css">
<style>
  /* Hanya untuk halaman preview ini: paksa overlay selalu tampil (di display.html asli, "show" dikontrol otomatis oleh display.js saat waktu iqamah tiba). */
</style>
</head>
<body>

<div class="iqamah-overlay show" id="iqamahOverlay">
  <!-- <div class="iqamah-label">Waktu Iqamah</div> -->
  <div class="iqamah-countdown" id="iqamahCountdown">07:32</div>

  <div class="iqamah-hadist">
    <div class="hadist-mark">&ldquo;</div>
    <div class="bg-hadist-iqamah" id="iqamahHadistBox">
      <p class="hadist-text" id="iqamahHadistText"></p>
      <div class="hadist-narrator-iqama" id="iqamahHadistNarrator"></div>
    </div>
  </div>
</div>

<script src="js/iqamah-hadist.js"></script>
<script>
  // Meniru display.js: hadist berganti sesuai lama layar iqamah tampil.
  var startedAt = Date.now();
  updateIqamahHadist(0);
  setInterval(function () { updateIqamahHadist(Date.now() - startedAt); }, 1000);
</script>
</body>
</html>
